spring:
  application:
    name: registry-service

  cloud:
    config:
      uri: http://localhost:8888  # Config Service URL for fetching configs

server:
  port: 8761  # Port for Eureka Server

eureka:
  client:
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    hostname: localhost
    preferIpAddress: true

