spring:
  datasource:
    url: jdbc:mysql://localhost:3306/auth_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: Root@1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

jwt:
  secret: care-nexus-secret-key
  expiration: 86400000  # 1 day in milliseconds

spring:
  cloud:
    config:
      uri: http://localhost:8888  # Config Service URL for fetching configs

application:
  name: auth-service

