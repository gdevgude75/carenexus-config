server:
  port: 8888

spring:
  cloud:
    config:
      server:
        git:
          uri: https://github.com/gdevgude75/carenexus-config  # Your GitHub repository URL
          default-label: main
  application:
    name: config-server

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka
    instance:
      preferIpAddress: true

management:
  endpoints:
    web:
      exposure:
        include: "*"

